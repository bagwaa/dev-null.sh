services:
  postgres:
    command: sudo -u postgres /usr/lib/postgresql/18/bin/postgres -D /var/lib/postgresql/18/main -c config_file=/etc/postgresql/18/main/postgresql.conf
    port: 5432
  web:
    command: >-
      php artisan config:clear &&
      APP_URL="$PUBLIC_URL" ASSET_URL="$PUBLIC_URL"
      php artisan serve --host=0.0.0.0 --port="$PORT"
    health: /up
    portal:
      title: /dev/null
      description: Built assets are ready. Use the local sign-in dialog with any username; GitHub credentials are not required.
